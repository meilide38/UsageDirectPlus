name: Release APKs

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-keystore.jks"
            {
              echo "KEYSTORE_FILE=$RUNNER_TEMP/release-keystore.jks"
              echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing keystore configured; building unsigned release APKs."
          fi

      - name: Build release APKs
        run: ./gradlew --no-daemon :Application:assembleDatabaseRelease :Application:assembleSystemRelease

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find Application/build/outputs/apk/database/release -maxdepth 1 -type f -name '*.apk' -exec cp {} release-assets/UsageDirectPlus-database.apk \;
          find Application/build/outputs/apk/system/release -maxdepth 1 -type f -name '*.apk' -exec cp {} release-assets/UsageDirectPlus-system.apk \;
          test -s release-assets/UsageDirectPlus-database.apk
          test -s release-assets/UsageDirectPlus-system.apk
          ls -lh release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/UsageDirectPlus-database.apk
            release-assets/UsageDirectPlus-system.apk
